<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>吉他手动挡 · Guitar Manual</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🎸 吉他手动挡</h1>
    <button id="connectBtn" class="connect-btn">🔌 连接 ESP32</button>
  </header>

  <main>
    <section class="chord-panel">
      <div id="chords" class="chord-grid"></div>
    </section>

    <section class="log-panel">
      <h2>串口日志</h2>
      <ul id="log"></ul>
    </section>
  </main>

  <footer>
    <p>ESP32 触摸引脚 → USB 串口 → 本页 Web Audio 实时合成</p>
    <p class="hint">提示: 第一次进页面先点「连接 ESP32」选你的串口; 没插板子也能点按钮试听。</p>
  </footer>

  <script src="karplus-strong.js"></script>
  <script src="app.js"></script>
</body>
</html>
